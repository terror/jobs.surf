[package]
name = "jobs-surf"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.lints.rust]
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arbitrary-source-item-ordering = "deny"
wildcard_imports = "allow"

[lints]
workspace = true

[workspace.dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls"] }
thiserror = "2.0.20"
tokio = { version = "1.52.0", features = ["macros", "net", "rt-multi-thread"] }

[dependencies]
anyhow = { workspace = true }
axum = "0.8.8"
clap = { version = "4.6.1", features = ["derive", "env"] }
dotenv = "0.15.0"
jobs-surf-db = { path = "crates/db" }
tokio = { workspace = true }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
sqlx = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
